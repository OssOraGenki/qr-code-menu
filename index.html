<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections Dragon Ball</title>
    <style>
        /* Style de la page (fond et texte) */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background-color: #f8f9fa; 
            color: #333;
        }
        h1 { 
            font-size: 22px; 
            margin-bottom: 30px; 
        }
        
        /* Style général des boutons */
        .bouton {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 15px auto;
            padding: 18px 20px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        /* Bouton pressé (effet visuel) */
        .bouton:active {
            transform: scale(0.98);
        }

        /* Couleurs spécifiques des boutons */
        .bouton-oep { 
            background-color: #2c3e50; /* Bleu foncé très pro */
        }
        .bouton-db { 
            background-color: #e67e22; /* Orange Dragon Ball */
        }
    </style>
</head>
<body>

    <h1>Découvrez nos collections Dragon Ball</h1>

    <!-- Premier bouton -->
    <a href="https://oep.fr/ventes/objets-dart-et-collection/dragon-ball-collections/" class="bouton bouton-oep">
        Vente OEP - Objets d'art
    </a>

    <!-- Deuxième bouton (Pensez à remplacer URL_DE_DBAUCTION par le vrai lien) -->
